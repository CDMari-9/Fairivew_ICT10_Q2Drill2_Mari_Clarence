<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>    
    <title>Adding New Club Member:</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: rgb(8, 174, 207);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .box{
            background-color: orange;
            padding: 30px;
            border-radius: 10px;
            text-align: left;
            width: 450px;
            box-sizing: border-box;
        }
        h1{
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 20px;
            color: white;
        }
        input{
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: none;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }
        buttom{
            padding: 10px 20px;
            ackground-color: navy;
            color: white;
            border: 1px solid white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        #result{
            margin-top: 10px;
            font-size: 15px;
            font-weight: normal;
            background-color: rgba(0, 0, 0, 0.25);
            padding: 20px;
            border-radius: 8px;
            line-height: 1.6;
            color: white;
        }
    </style>
</head>
<body>
    <div class ="box">
        <h1>Band Club</h1>
        <p>Adding New Club Members:</p>
        <input type="text" id="fname" placeholder="First Name">
        <input type="text" id="lname" placeholder="Last Name">
        <button py-click="verify_member">SUBMIT</button>
        <div id="result"></div>
        <py-script src="main.py"></py-script>
    </div>
</body>
</html>
