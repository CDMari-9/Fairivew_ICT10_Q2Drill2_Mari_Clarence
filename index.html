<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>    
    <title>Adding New Club Member:</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: rgb(8, 174, 207);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box{
            background-color: orange;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            width: 400px;
        }

        input{
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }
        button{
            padding: 10px 20px;
            background-color: navy;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result{
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class ="box">
        <h1>Band Club</h1>
        <p>Adding New Club Members:</p>
        <input type="text" id="fname" placeholder="First Name">
        <input type="text" id="lname" placeholder="Last Name">
        <button py-click="verify_member">SUBMIT</button>
        <div id="result"></div>
        <py-script src="main.py"></py-script>
    </div>
</body>
</html>
